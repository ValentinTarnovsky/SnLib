# ═══════════════════════════════════════════════════════════════════
# MENU LIB - GUI Configuration Schema (golden spec)
# ═══════════════════════════════════════════════════════════════════
# One GUI per file inside the plugin's guis/ folder.
# Every field documented here is supported natively by SnLib: if the config
# user sets a supported field, it ALREADY works without plugin code.

title: string # default: "Menu"
# Resolved per viewer through PAPI. Since 1.22.0 it also resolves the local
# placeholders the plugin passes to Gui.open(player, Ph...) / GuiSession
# .titlePlaceholders(...), so a menu whose subject is NOT its viewer can name
# that subject: "{player}'s Inventory", "{clan} Members". The token is the
# plugin's to define; with none passed the title renders exactly as written.
rows: 1-6 # default: 3
open-sound: id # default: ''
close-sound: id # default: '' (played when the viewer closes the menu)
update-interval: int (in ticks) # every update-interval ticks, the menu will update all its information, including items, title, and rows. If set to 0, the menu will not update automatically. # defalt: 0
inventory-type: string # default: "CHEST" (can be any of the following: CHEST, DISPENSER, DROPPER, HOPPER, FURNACE, WORKBENCH, ENCHANTING, BREWING, ANVIL, BEACON, SHULKER_BOX, BARREL, etc)

# ═══════════════════════════════════════════════════════════════════
# PAGINATION - OPT-IN per menu
# ═══════════════════════════════════════════════════════════════════
# pagination: true  -> the GUI keeps ONE GuiSession + ONE Inventory PER VIEWER
#                      (real page-state per player: the same GUI can serve N
#                      players on different pages at the same time).
#                      [next-page]/[previous-page]/[set-page]/[refresh-page]
#                      work, and bindPaged fills the paged slots via API.
# pagination: false -> (default) pagination actions are silent no-ops with a
#                      debug note, and bindPaged WARNs once.
# Without a live bindPaged the total pages is unknown and the "next" nav item
# never disables, unless the plugin declares the total via
# GuiSession.setTotalPages(n).
pagination: true/false # default: false

# ═══════════════════════════════════════════════════════════════════
# LAYOUT - ASCII mask (alternative to slots:)
# ═══════════════════════════════════════════════════════════════════
# layout: optional list of 1-6 strings of up to 9 characters each, read top
# to bottom over the 9-column chest grid: the cell at row i / column j is
# slot i*9+j. ' ' (space) is ALWAYS an empty cell. Rows beyond 6 and
# characters beyond 9 per row are truncated with a WARN. With a layout
# present, rows derives from the number of layout rows; a contradictory
# rows: value WARNs and the layout wins. Items reference layout characters
# through their key: field (see example-layout-item below).
# layout:
#   - "fffffffff"
#   - "f ddddd f"
#   - "f ddddd f"
#   - "fffffffff"
#
# paged-key: menu-level, exactly ONE character of the layout: its cells
# become the target slots of the no-slots Java overload
# bindPaged(templateId, data, mapper), so plugins can page data without
# hardcoding an int[] (pagination: true required; with pagination false the
# value is kept but bindPaged stays ignored until pagination is enabled).
# An invalid paged-key, one absent from the layout or one declared without
# layout WARNs and is ignored.
# paged-key: d

# ═══════════════════════════════════════════════════════════════════
# RUNTIME REGIONS - named groups of cells the plugin fills (1.20.0)
# ═══════════════════════════════════════════════════════════════════
# regions: menu-level named groups of cells. The plugin lays ONE ENTRY PER
# CELL over a region with bindEach(regionId, data, filler), and the filler
# picks that entry's template and placeholders. This is how a matrix, a
# selector or a non-paged list gets its placement from the FILE instead of
# from an int[] in Java. No pagination needed - a region is the non-paged
# sibling of paged-key.
#
# Short form (a single layout character):
# regions:
#   toggles: t
#
# Long form - slots: (wins over key:, exactly like an item) or key::
# regions:
#   toggles:
#     slots: ["19-25", "28-30", "32-34"]
#
# ORDER: entry i renders into cell i of the region. With key: the cells are
# ascending row-major (left to right, top to bottom); with slots: they are
# the order you wrote them, so slots: is how you REORDER a region by hand.
# Reordering changes the PICTURE only - every entry carries its own id in
# its placeholders, so a switch can never end up toggling something else.
#
# SIZING is yours: fewer cells than entries simply shows the first ones and
# drops the tail; more cells than entries leaves the spare cells to the
# items declared on them (declare an item on the region letter and it fills
# the gaps). Neither warns - it is configuration, not a mistake.
#
# TO REMOVE a region: take its letter out of layout:, or blank its value
# (toggles: "" / an empty slots: list). Both are silent and supported.
# Do NOT delete the regions: declaration itself - it is re-added on the next
# restart and the plugin warns that the region is missing. For the same
# reason regions: must never be marked # sn:extensible.
#
# THE RULE: distinct letters name distinct ELEMENTS and are bound BY NAME
# through key: on an item or template. ONE REPEATED letter is an ordered
# REGION and is bound BY INDEX through regions: + bindEach. Never express an
# ordered sequence with distinct letters - "123" cannot be indexed and is
# just three unrelated cells.
#
# Malformed declarations WARN and leave the region declared with no cells:
# both slots: and key: (slots wins), neither of them, a key longer than one
# character, a key without any layout:, and cells that overlap the paged-key
# (the paged bind wins there) or an earlier region (the later one wins).
# regions:
#   toggles: t

# ═══════════════════════════════════════════════════════════════════
# STRICT CLICKS - OPT-IN per menu
# ═══════════════════════════════════════════════════════════════════
# strict-clicks: true  -> the generic click-actions list only fires with the
#                         four basic mouse clicks: LEFT, RIGHT, SHIFT_LEFT and
#                         SHIFT_RIGHT. Every other ClickType (Q, hotbar keys
#                         1-9, F, middle, double-click, etc) is cancelled
#                         without running anything (no click nor deny actions).
#                         Per-click specific lists still match their exact type
#                         even in strict mode: middle-click-actions enables
#                         MIDDLE, and a declared left-click-actions enables
#                         DOUBLE_CLICK and CREATIVE (the left side groups
#                         them). NUMBER_KEY, DROP, CONTROL_DROP, SWAP_OFFHAND
#                         and UNKNOWN have no possible specific list and stay
#                         always discarded in strict mode.
# strict-clicks: false -> (default) historic v1.0.0 behaviour: any ClickType
#                         fires the resolved actions list.
strict-clicks: true/false # default: false

# ═══════════════════════════════════════════════════════════════════
# PLAYER INVENTORY - what the viewer may do with their OWN items (1.28.0)
# ═══════════════════════════════════════════════════════════════════
# player-inventory: locked -> (default) every click and drag over the
#                             viewer's own inventory is cancelled while the
#                             menu is open. Nothing moves, nothing can be
#                             picked up, and their cursor stays empty for
#                             the whole session. Exactly how every menu
#                             behaved before 1.28.0.
# player-inventory: open   -> the viewer uses their own inventory normally:
#                             plain clicks, number keys, Q drops, F offhand
#                             swaps and drags that stay inside their
#                             inventory all work again. Two things stay
#                             cancelled and are what keeps this safe: every
#                             click over THIS menu's cells, and the
#                             double-click gather, so no menu item can ever
#                             reach the cursor.
#                             With it open, a SHIFT-CLICK on one of their
#                             own stacks is reported to the plugin as an
#                             offer (see input: below) instead of moving the
#                             item: the menu never receives items by itself.
# Unknown values WARN and fall back to locked.
# This key governs the BOTTOM inventory only; which CELLS of the menu accept
# an item is the per-item input: key.
player-inventory: locked/open # default: locked

items:
  item-id: #can be anything as long it is unique
    display-name: string # default: ""
    material: string (can resolve basehead-base64) #default: "STONE"
    skull-owner: string # player name or UUID; placeholders resolve per viewer; requires PLAYER_HEAD # default: ""
    attributes: list ex: ["ATTRIBUTE OPERATION amount [slot-group]"] # attribute modifiers, static values # default: []
    damage: int # initial vanilla damage already spent; needs a material with durability # default: not set
    unbreakable: true/false # only applied when the key is present # default: not set
    max-stack-size: int (1-99) # only applied when the key is present; probe-based, skipped with one WARN on 1.20.4 # default: vanilla default for the material
    equipment-slot: string # restricts where the item can be equipped: MAINHAND, OFFHAND, HEAD, CHEST, LEGS, FEET # default: "" (any slot)
    custom-model-data: int # only stamped when the key is present; 0 is NOT the same as omitting the key # default: not set
    item-model: string # 1.21.2+ base ItemModel key, ex "nexo:2d_player_head"; no namespace -> minecraft:; independent of custom-model-data (both can coexist); skipped with one WARN below 1.21.2 # default: ""
    amount: int # default: 1
    slots: list ex: [0, 1, 2] or [0-2] or [0, 2, 4-6] # alternative: key (one layout character, see example-layout-item); several items may declare the same slot or key (see example-shared-slot below)
    glow: true/false # default: false
    enchantments: list ex: [enchantment-id, level] or [enchantment-id, level, enchantment-id, level] # default: []
    flags: # default: []
    - string (can be any of the following: HIDE_ENCHANTS, HIDE_ATTRIBUTES, HIDE_UNBREAKABLE, HIDE_DESTROYS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS)
    - create a HIDE_ALL flag by adding all of the above flags to the list
    - HIDE_TOOLTIP hides the WHOLE tooltip box, display name included; NOT part of HIDE_ALL (1.29.0; needs 1.20.5+, skipped with one WARN below that)
    color: RGB # 235, 64, 52 or HEX # FF0000 (for any item that supports color, like leather armor) # default: ""
    trim-pattern: string (armor only; any trim pattern id the server registry knows, ex SENTRY, DUNE, COAST, WILD, WARD, EYE, VEX, TIDE, SNOUT, RIB, SPIRE, WAYFINDER, SHAPER, SILENCE, RAISER, HOST; NONE or empty disables; must be set together with trim-material) # default: ""
    trim-material: string (armor only; any trim material id the server registry knows, ex QUARTZ, IRON, NETHERITE, REDSTONE, COPPER, GOLD, EMERALD, DIAMOND, LAPIS, AMETHYST; NONE or empty disables; must be set together with trim-pattern) # default: ""
    potion-effects: list ex: [effect-id, level, duration] or [effect-id, level, duration, effect-id, level, duration] # default: []
    update-interval: int (in ticks) # every update-interval ticks, the item will update all its information, including items, title, and rows. If set to 0, the item will not update automatically. # defalt: 0
    input: true/false # 1.28.0; the cell RECEIVES an item (see example-input-item below) # default: false
    lore: list (each line of lore) # default: []
    click-requirements: list of requirements to click this item, placeholders that have to match in order to click this item, if it doesn't match, the action will not be performed # default: []
      - "%placeholder% > 0 && %placeholder% < 10" #ex: %player_level% > 0 && %player_level% < 10
      - "%placeholder% = 1" #ex: %vault_balance% = 1
      - "%placeholder% != 1" #ex: %vault_balance% != 1
    view-requirements: list of requirements to view this item, placeholders that have to match in order to view this item, if it doesn't match, the item will not be displayed AND it cannot be clicked either (an item you cannot see fires nothing at all, not even the deny-actions, so there is no need to repeat the expression in click-requirements). When several items share a slot, a failing view requirement passes the cell to the NEXT declared candidate (see example-shared-slot below) # default: []
      - "%placeholder% > 0 && %placeholder% < 10" #ex: %player_level% > 0 && %player_level% < 10
      - "%placeholder% = 1" #ex: %vault_balance% = 1
      - "%placeholder% != 1" #ex: %vault_balance% != 1
    deny-actions: all same actions as click-actions but with "deny" instead of "click" but the actions will be performed only if the click-requirements are not met # default: []
    click-actions: # list of actions to perform when the item is clicked,
      - "[player] spawn"          # run command as player
      - "[player-as-op] give %player_name% diamond 1" # run command as op player
      - "[right-click] spawn"     # run command as player when right-click
      - "[left-click] spawn"      # run command as player when left-click
      - "[shift-left-click] spawn"     # run command as player when shift-left-click
      - "[shift-right-click] spawn"     # run command as player when shift-right-click
      - "[right-click-only] spawn" # pure RIGHT: excludes shift-right and double-click
      - "[left-click-only] spawn" # pure LEFT: excludes shift-left, double-click and creative
      - "[click=MIDDLE,DROP] say hi" # generic guard against the ClickType enum, case-insensitive, - equals _
      - "[middle-click] say hi"   # exact MIDDLE click
      - "[double-click] say hi"   # exact DOUBLE_CLICK
      - "[drop-click] say hi"     # exact DROP (the Q key)
      - "[number-key] say hi"     # exact NUMBER_KEY (hotbar keys 1-9)
      - "[swap-offhand] say hi"   # exact SWAP_OFFHAND (the F key)
      # Compat note: [right-click]/[left-click] keep their inclusive v1.0.0
      # semantics ([right-click] also passes with SHIFT_RIGHT; [left-click]
      # also passes with SHIFT_LEFT, DOUBLE_CLICK and CREATIVE).
      # [click-block]/[click-air] exist too, but in a GUI the line is always
      # skipped (the click surface is null there; they are for world items,
      # see item-example.yml).
      - "[console] give %player_name% diamond 1" # run command as console
      - "[message] &aWelcome!"    # send message to player
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP" # play sound
      - "[close]"                 # close the menu
      - "[open] gui-id"        # open another menu
      - "[connect] lobby"         # BungeeCord server switch
      - "[broadcastmessage] &e%player_name% joined!" # broadcast
      - "[actionbar] &aItem purchased!" # action bar message
      - "[title] &6Welcome;&eEnjoy your stay;20;40;20" # title message (title;subtitle;fadeIn;stay;fadeOut)
      - "[next-page]" # next page (pagination: true only)
      - "[previous-page]" # previous page (pagination: true only)
      - "[refresh-page]" # refresh page (pagination: true only)
      - "[set-page]" # set page (pagination: true only)
      - "[refresh-menu]" # refresh menu
      - "[custom]" #custom actions that plugins can create not need to be "custom" can be any string and the plugin will register its own action

    # ═══════════════════════════════════════════════════════════════════
    # PER-CLICK MATRIX - specific lists per click type (all optional)
    # ═══════════════════════════════════════════════════════════════════
    # Besides the generic click-actions / click-requirements / deny-actions,
    # five click keys each accept three optional lists (15 keys total).
    # Resolution is specific-over-generic and FIELD BY FIELD (actions,
    # requirement and deny list each resolve independently):
    #   1) the exact shift list of the click, when declared
    #      (SHIFT_RIGHT / SHIFT_LEFT)
    #   2) the side list, when declared (right covers RIGHT and SHIFT_RIGHT;
    #      left covers LEFT, SHIFT_LEFT, DOUBLE_CLICK and CREATIVE; middle
    #      covers MIDDLE)
    #   3) fallback to the generic click-actions / click-requirements /
    #      deny-actions
    # A list counts as declared only when it is non-empty. An item may declare
    # right-click-actions without right-click-requirements and its requirement
    # still resolves from the generic click-requirements. No existing menu
    # changes: every new key is optional.
    right-click-actions: list # default: []
    right-click-requirements: list # default: []
    right-click-deny-actions: list # default: []
    left-click-actions: list # default: []
    left-click-requirements: list # default: []
    left-click-deny-actions: list # default: []
    shift-right-click-actions: list # default: []
    shift-right-click-requirements: list # default: []
    shift-right-click-deny-actions: list # default: []
    shift-left-click-actions: list # default: []
    shift-left-click-requirements: list # default: []
    shift-left-click-deny-actions: list # default: []
    middle-click-actions: list # default: []
    middle-click-requirements: list # default: []
    middle-click-deny-actions: list # default: []

  # ═══════════════════════════════════════════════════════════════════
  # PAGINATION NAVIGATION ITEMS (only meaningful with pagination: true)
  # ═══════════════════════════════════════════════════════════════════
  # Navigation items are regular items whose click-actions use the pagination
  # actions. Each one supports an optional "nav-disabled" section: an item
  # override rendered in the SAME slots INSTEAD of the navigation item when
  # there is no page to go to (first page for previous, last page for next).
  # nav-disabled supports the same appearance fields as a regular item
  # (display-name, material, custom-model-data, item-model, amount, glow, lore, flags...)
  # but no slots and no actions: a disabled arrow never fires anything.

  previous-page:
    display-name: "[rgb]&lPrevious Page"
    material: ARROW
    slots: [45]
    click-actions:
      - "[previous-page]"
      - "[sound] UI_BUTTON_CLICK"
    nav-disabled: # shown on the first page instead of this item
      display-name: "&7No previous page"
      material: GRAY_STAINED_GLASS_PANE
      lore:
        - "&8You are on the first page"

  next-page:
    display-name: "[center][rgb]Next Page"
    material: ARROW
    slots: [53]
    click-actions:
      - "[next-page]"
      - "[sound] UI_BUTTON_CLICK"
    nav-disabled: # shown on the last page instead of this item
      display-name: "<gray>No next page</gray> &8(last page)"
      material: GRAY_STAINED_GLASS_PANE
      lore:
        - "&8You are on the last page"

  # ═══════════════════════════════════════════════════════════════════
  # TEXT PIPELINE EXAMPLES (SnText)
  # ═══════════════════════════════════════════════════════════════════
  # [small]  -> small caps glyph substitution: a-z and A-Z map to small cap
  #             glyphs, accented vowels lose the accent, enye keeps its default
  #             glyph, digits/symbols/color codes/MiniMessage tags pass through.
  #             Runs BEFORE [rgb] so the gradient colors the final glyphs.
  # [rgb]    -> per-character gradient interpolated over 7 fixed anchors
  #             (#F300F3,#5555FF,#55FFFF,#55FF55,#FCFF21,#FF9B00,#FF5327).
  #             Pre-existing COLOR codes are OVERRIDDEN; FORMAT codes
  #             (&l &o &n &m &k) are PRESERVED.
  # [center] -> centers the line at 154px, applied over the legacy-colored
  #             string (gradient already interpolated) as the LAST step
  #             before rendering to Component.
  # All three prefix tags ([small]/[rgb]/[center]) are composable in ANY order.
  # Legacy codes (&a, &#RRGGBB) and MiniMessage tags render together.

  example-text-item:
    display-name: "[rgb]&lEpic Gradient Title"
    material: NETHER_STAR
    slots: [22]
    lore:
      - "[center][rgb]Centered gradient line"
      - "[rgb][center]Same result, tags in any order"
      - "[center]&eCentered legacy-only line"
      - "[small]Small caps lore line"
      - "[center][small][rgb]All three tags composed"
      - "<bold><#55FFFF>MiniMessage</#55FFFF></bold> &7mixed with &alegacy codes"
      - "&7Hex legacy: &#FF9B00orange &7plus <italic>MiniMessage italic</italic>"

  # ═══════════════════════════════════════════════════════════════════
  # LAYOUT-KEYED ITEM - key: instead of slots: (requires a menu layout:)
  # ═══════════════════════════════════════════════════════════════════
  # key: exactly ONE character of the menu layout. The item renders in
  # EVERY layout cell holding that character (a filler key appearing in N
  # cells renders in the N slots). If both key and slots are declared,
  # slots wins with a WARN and key is ignored. An invalid multi-character
  # key, or a key declared in a menu with no layout at all, ignores the
  # item with a WARN.
  # REMOVING A BUTTON: delete its character from the layout above. The
  # item stays declared here but is not rendered, and nothing is logged -
  # this is the intended way to remove a button without editing items:.
  # Templates resolve key: the same way since 1.18.0; nav-disabled
  # override sections do not support key.
  example-layout-item:
    display-name: "&7Filler"
    material: GRAY_STAINED_GLASS_PANE
    key: f

  # ═══════════════════════════════════════════════════════════════════
  # SHARED SLOT - conditional variants of one cell (1.17.0)
  # ═══════════════════════════════════════════════════════════════════
  # N items may declare the same slot (or the same layout key). Candidates
  # are tried in DECLARATION ORDER and the first one whose view-requirements
  # pass for the viewer owns the cell - no priority field, declare the
  # preferred item first. If every candidate is hidden the cell renders
  # empty. Clicks resolve the same winner, so each variant fires its own
  # click-actions. Typical use: one button per state, like the pair below
  # (a member sees the info button, a clanless player the create button).
  example-shared-slot-a:
    display-name: "&aYour clan"
    material: BEACON
    slots: [22]
    view-requirements:
      - "%snclans_has_clan% == true"
    click-actions:
      - "[player] clan info"
  example-shared-slot-b:
    display-name: "&eCreate a clan"
    material: EMERALD
    slots: [22]
    view-requirements:
      - "%snclans_has_clan% == false"
    click-actions:
      - "[player] clan create"

  # ═══════════════════════════════════════════════════════════════════
  # INPUT CELL - the menu RECEIVES an item (1.28.0)
  # ═══════════════════════════════════════════════════════════════════
  # input: true turns this item's cells into INPUT SLOTS. A viewer who
  # clicks one while holding a stack, or drags a stack onto one, has that
  # stack reported to the plugin; with player-inventory: open a shift-click
  # on one of their own stacks is reported the same way. The item still
  # renders exactly as declared: this is a normal button that also accepts
  # an item.
  #
  # WHAT SNLIB GUARANTEES: the item is READ, never consumed. Every one of
  # those events is CANCELLED, so the stack goes straight back to the
  # player's cursor or inventory. SnLib never moves it, never shrinks it and
  # never puts it into the menu.
  #
  # THIS IS THE ONE FIELD WHOSE OTHER HALF IS PLUGIN CODE. Everything else
  # in this file works with zero Java; here the yml DECLARES which cells
  # accept an item, and the plugin decides what accepting one means
  # (session.onOffer(...) in the developer docs). Set input: true on a menu
  # whose plugin does not handle offers and the click is simply cancelled -
  # nothing is lost, nothing happens.
  #
  # A click with an EMPTY cursor is not an offer: it runs the click-actions
  # below as usual, so one cell can be a button AND a drop target.
  #
  # NEEDS player-inventory: open. With the inventory locked the viewer can
  # never pick a stack up in the first place, so nothing can ever be
  # offered; declaring input: true without it WARNs on load.
  example-input-item:
    display-name: "&eDrop an item here"
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    slots: [13]
    input: true
    lore:
      - "&7Click while holding an item"
      - "&7or shift-click it from your inventory"
    click-actions: # fired only by a click with an EMPTY cursor
      - "[message] &7Hold the item you want to place."

  # ═══════════════════════════════════════════════════════════════════
  # PLAYER HEAD ITEM - skull-owner resolves placeholders PER VIEWER
  # ═══════════════════════════════════════════════════════════════════
  # skull-owner accepts a player name or UUID; with a placeholder each viewer
  # sees their own resolved head. Requires material PLAYER_HEAD; an uncached
  # name falls back to the default head with one WARN.
  example-head-item:
    display-name: "&eYour head, %player_name%"
    material: PLAYER_HEAD
    skull-owner: '%player_name%'
    slots: [40]

# ═══════════════════════════════════════════════════════════════════
# CLOSE ACTIONS - menu-level (optional)
# ═══════════════════════════════════════════════════════════════════
# close-actions: same grammar as click-actions. Runs once per close, on the
# natural client close (ESC) and on the [close] action. Does NOT run on page
# changes or inventory recreations, nor when the plugin closes the session
# programmatically (reload, owner disable, quit cleanup). Click guards inside
# these lines are skipped with a debug note because there is no click.
# close-actions:
#   - "[message] &7See you soon!"
#   - "[sound] UI_BUTTON_CLICK"

# ═══════════════════════════════════════════════════════════════════
# TEMPLATES - Reusable items for plugin developers
# ═══════════════════════════════════════════════════════════════════
# Templates are IDENTICAL to items, with "slots:"/"key:" OPTIONAL instead of required.
# The plugin supplies the runtime data (custom placeholders like %index%, %warp_name%)
# at bind time; the config user customizes appearance and actions freely.
#
# Placement, three ways:
#   - CONFIG-DRIVEN: the template declares "slots:" or "key:" (resolved against the
#     menu "layout:" exactly like an item; declared slots win over key) and the plugin
#     binds it WITHOUT a slot: session.bind("template-id", phs...). Moving the key in
#     the layout, or editing slots:, repositions the element - no plugin update needed.
#     A key covering N cells renders the same bind into every cell.
#   - REGION-DRIVEN (1.20.0): the template declares NOTHING and the cell comes from a
#     "regions:" entry the plugin fills with bindEach - the filler picks which template
#     paints each cell. This is the one to use for state variants of the same button
#     (allowed/denied, selected/unselected): several templates share one region, so none
#     of them can own the placement and none should declare a key:.
#   - PLUGIN-DRIVEN: the template declares neither, and the plugin decides per bind:
#     session.bind(slot, template, phs...). The explicit slot variant always ignores
#     the declared cells, so per-entry lists (one template bound N times with
#     different data) keep working. Prefer a region over this whenever the menu is
#     file-backed: a slot decided in Java is a slot the owner cannot move.
#
# PLUGIN-SUPPLIED APPEARANCE (1.21.0) - affects what you can configure here:
#   All three bind surfaces let the plugin hand over a ready-made ItemStack for a cell
#   (bind(slot, template, stack, phs...), PhCollector.stack(...) inside bindPaged and
#   GuiEntry.stack(...) inside bindEach). It exists for contents the plugin did not
#   author - a crate reward, kit contents, shop stock - whose enchantments, custom model
#   data, head texture and custom name cannot be re-expressed as a yml item definition.
#   When a bind supplies a stack, the STACK decides the appearance and this template
#   still decides the behaviour, so on such a template only these keep any effect:
#     - display-name: when non-empty it REPLACES the stack's own name (leave it out or
#       blank it to keep the item's real name);
#     - lore: the lines are APPENDED after the lore the item already has (leave it out
#       to show the item exactly as it is);
#       Leaving BOTH out adds nothing whatsoever: no blank line, no cleared lore, no
#       rewrite of what the plugin handed in. Careful with the difference between
#       "lore:" / "lore: []" (declares nothing, the item keeps its own lore untouched)
#       and a list holding an empty string (declares ONE blank line, appended as a
#       spacer). The same goes for display-name: absent and "" both mean "keep the
#       item's real name".
#     - view-requirements, click-requirements, deny-actions, click-actions, the per-click
#       matrix and update-interval - all unchanged.
#   material, amount, glow, enchantments, custom-model-data and every other appearance
#   field are IGNORED for that cell (the stack already carries them). Nothing changes for
#   a bind that supplies no stack: the template renders the cell as it always has.
#
# Usage example (backpack plugin):
#   - Plugin defines: backpack-slots: [0,1,2,3,4]
#   - Plugin code decides per-player: slot 0 -> "backpack-available", slots 1-4 -> "backpack-locked"
#   - Config user customizes the look of each template

templates:
  template-id: # can be anything as long it is unique
    # Supports ALL the same fields as a regular item:
    display-name: string # default: ""
    material: string (can resolve basehead-base64) # default: "STONE"
    custom-model-data: int # default: 0
    item-model: string # 1.21.2+ base ItemModel key # default: ""
    amount: int # default: 1
    # slots:/key: OPTIONAL - declared cells feed the no-slot bind("template-id");
    # without them the plugin assigns slots dynamically via bind(slot, template).
    # IGNORED when a region paints this template: the region already decided the cell.
    glow: true/false # default: false
    enchantments: list # default: []
    flags: list # default: []
    color: RGB/HEX # default: ""
    trim-pattern: string # default: "NONE"
    trim-material: string # default: "NONE"
    potion-effects: list # default: []
    update-interval: int # default: 0
    input: true/false # 1.28.0; the cell the plugin binds this template to RECEIVES an item # default: false
    lore: list # default: []
    click-requirements: list # default: []
    view-requirements: list # default: []
    deny-actions: list # default: []
    click-actions: list # default: []
    # Templates also support the same per-click matrix keys as regular items
    # (right/left/shift-right/shift-left/middle x actions/requirements/
    # deny-actions) with the same specific-over-generic resolution.
