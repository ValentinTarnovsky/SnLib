# ============================================================
#  SnLib - shared runtime of the Sn plugins
#  Managed config: keys added by future versions are merged in
#  on every start; your values and extra keys are preserved.
# ============================================================

# Master gate of the always-merge updater: false skips every yml merge except this file.
update-configs: true

# Runtime debug output of the library itself (also toggleable live, no restart needed).
debug:
  # Master toggle of the debug output.
  enabled: false
  # Verbosity threshold: OFF, INFO, DEBUG or TRACE.
  level: DEBUG
  # Category filter; an empty list lets every category through.
  categories: []

# Anonymous usage metrics via bStats (https://bstats.org); set false to opt out.
bstats: true

# Keeps SnLib.jar itself up to date. SnLib downloads its own newer release from its public
# GitHub repository, verifies it (SHA-256 published by the API plus the plugin.yml inside
# the jar), replaces the file on disk and reports that a restart is pending.
# It NEVER swaps classes at runtime: the downloaded version only becomes active on the next
# full server restart. This applies to SnLib.jar ONLY; plugins built on SnLib are never
# downloaded, moved or deleted by it.
auto-update:
  # Master toggle of the self-updater.
  enabled: true
  # Hours between checks; the first one runs 2 minutes after startup. Clamped to 1-168.
  interval-hours: 12
  # Only install releases within the installed major version (1.15.0 -> 1.16.0 yes,
  # 1.x -> 2.0.0 no). A major jump is only reported, never installed on its own.
  same-major-only: true
